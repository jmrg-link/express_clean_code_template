# Prometheus v3.8.1 scrape config
# - Scrapea las métricas de Traefik en :8082
# - Scrapea Prometheus a sí mismo
# - Scrapea la API Express en :3000/metrics (PrometheusMetrics middleware, v4.0.1)
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "express-clean-backend"

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: traefik
    metrics_path: /metrics
    static_configs:
      - targets: ["traefik:8082"]
        labels:
          service: traefik

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]
        labels:
          service: api
