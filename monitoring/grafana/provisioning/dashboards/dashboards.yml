# Provider de dashboards: Grafana lee periódicamente los JSON del directorio
# /var/lib/grafana/dashboards montado desde monitoring/grafana/dashboards/.
apiVersion: 1

providers:
  - name: 'express-clean-backend'
    orgId: 1
    folder: 'Express Clean Backend'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
